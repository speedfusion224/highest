workflows:
  ios-testflight:
    name: Highest Wash → TestFlight
    max_build_duration: 60
    environment:
      vars:
        VITE_SUPABASE_URL: "https://jxilnjudduetykuxiehp.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWxuanVkZHVldHlrdXhpZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTQ5NDcsImV4cCI6MjA5Mzc5MDk0N30.iJHSz-8QQ_VoUd25E0890PgBfaC4b8igNSSyy9LZVc4"
        VITE_SUPABASE_PROJECT_ID: "jxilnjudduetykuxiehp"
        SUPABASE_URL: "https://jxilnjudduetykuxiehp.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWxuanVkZHVldHlrdXhpZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTQ5NDcsImV4cCI6MjA5Mzc5MDk0N30.iJHSz-8QQ_VoUd25E0890PgBfaC4b8igNSSyy9LZVc4"
        VITE_PAYSTACK_PUBLIC_KEY: "pk_live_671fccd651daf066804466572cfd0b7c47df2471"
        APP_STORE_CONNECT_ISSUER_ID: "07922d40-426a-4a77-bc97-4d2959bfb708"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "W8RCTZ59R2"
        APPLE_TEAM_ID: "57UCKCV8XK"
        BUNDLE_ID: "com.highestwash.app"
        APP_STORE_CONNECT_PRIVATE_KEY_B64: ""

      node: "20.11.0"
      xcode: "16.2"
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build Vite/React app
        script: npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Fix bundle ID and signing in Xcode project
        script: |
          # Fix bundle ID typo (cap generates com.highestwas.app instead of com.highestwash.app)
          sed -i '' 's/com\.highestwas\.app/com.highestwash.app/g' ios/App/App.xcodeproj/project.pbxproj
          # Fix bundle ID in Info.plist too
          plutil -replace CFBundleIdentifier -string "com.highestwash.app" ios/App/App/Info.plist || true
          # Force manual signing and set team
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 57UCKCV8XK;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Set up code signing
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode)
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          # Get the downloaded profile UUID and inject it
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -1)
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          echo "Using profile UUID: $PROFILE_UUID"
          sed -i '' "s/PROVISIONING_PROFILE = \"\";/PROVISIONING_PROFILE = \"$PROFILE_UUID\";/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Archive app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -config Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=57UCKCV8XK \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            archive

      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>57UCKCV8XK</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: ""
        key_id: "W8RCTZ59R2"
        issuer_id: "07922d40-426a-4a77-bc97-4d2959bfb708"
        submit_to_testflight: true
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
