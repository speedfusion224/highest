  ios-testflight:
    name: Highest Wash → TestFlight
    max_build_duration: 60
    environment:
      vars:
        # ─── Supabase ───────────────────────────────────────────────
        VITE_SUPABASE_URL: "https://jxilnjudduetykuxiehp.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWxuanVkZHVldHlrdXhpZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTQ5NDcsImV4cCI6MjA5Mzc5MDk0N30.iJHSz-8QQ_VoUd25E0890PgBfaC4b8igNSSyy9LZVc4"
        VITE_SUPABASE_PROJECT_ID: "jxilnjudduetykuxiehp"
        SUPABASE_URL: "https://jxilnjudduetykuxiehp.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWxuanVkZHVldHlrdXhpZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTQ5NDcsImV4cCI6MjA5Mzc5MDk0N30.iJHSz-8QQ_VoUd25E0890PgBfaC4b8igNSSyy9LZVc4"

        # ─── Paystack ───────────────────────────────────────────────
        VITE_PAYSTACK_PUBLIC_KEY: "pk_live_671fccd651daf066804466572cfd0b7c47df2471"

        # ─── Apple ──────────────────────────────────────────────────
        APP_STORE_CONNECT_ISSUER_ID: "07922d40-426a-4a77-bc97-4d2959bfb708"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "W8RCTZ59R2"
        APPLE_TEAM_ID: "57UCKCV8XK"
        BUNDLE_ID: "com.highestwash.app"
        APP_STORE_CONNECT_PRIVATE_KEY_B64: ""

      # ─── Pinned versions for stability ──────────────────────────
      node: "20.11.0"
      xcode: "16.2"
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build Vite/React app
        script: npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Set up code signing
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode)

          # Initialize keychain — keeps the same keychain across retries
          keychain initialize

          # fetch-signing-files is idempotent:
          # - If cert/profile already exist on Apple portal → reuses them
          # - If they don't exist yet → creates them once
          # So rebuilds always reuse the same keys, never generate duplicates
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # Archive provisioning profile used — for debugging if needed
      - $HOME/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision

    publishing:
      app_store_connect:
        api_key: ""
        key_id: "W8RCTZ59R2"
        issuer_id: "07922d40-426a-4a77-bc97-4d2959bfb708"
        submit_to_testflight: true
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
