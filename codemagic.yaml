workflows:
  ios-testflight:
    name: Highest Wash → TestFlight
    max_build_duration: 60
    environment:
      vars:
        # ─── Supabase ───────────────────────────────────────────────
        VITE_SUPABASE_URL: "https://jxilnjudduetykuxiehp.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWxuanVkZHVldHlrdXhpZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTQ5NDcsImV4cCI6MjA5Mzc5MDk0N30.iJHSz-8QQ_VoUd25E0890PgBfaC4b8igNSSyy9LZVc4"
        VITE_SUPABASE_PROJECT_ID: "jxilnjudduetykuxiehp"
        SUPABASE_URL: "https://jxilnjudduetykuxiehp.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWxuanVkZHVldHlrdXhpZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTQ5NDcsImV4cCI6MjA5Mzc5MDk0N30.iJHSz-8QQ_VoUd25E0890PgBfaC4b8igNSSyy9LZVc4"

        # ─── Paystack ───────────────────────────────────────────────
        VITE_PAYSTACK_PUBLIC_KEY: "pk_live_671fccd651daf066804466572cfd0b7c47df2471"

        # ─── Apple ──────────────────────────────────────────────────
        APP_STORE_CONNECT_ISSUER_ID: "07922d40-426a-4a77-bc97-4d2959bfb708"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "W8RCTZ59R2"
        APPLE_TEAM_ID: "57UCKCV8XK"
        BUNDLE_ID: "com.highestwash.app"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.highestwash.app

      node: latest
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build Vite/React app
        script: npm run build

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Write Apple API Key (.p8)
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat > ~/.appstoreconnect/private_keys/AuthKey_W8RCTZ59R2.p8 << 'APPLE_KEY'
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQglRLd4QgnJHPPaM8r
          67Cu7McnleQ6TFtFBSbl2igMaC2gCgYIKoZIzj0DAQehRANCAAQ0o/M59ok6PMhU
          9j9ITnZVsuUEUtkqBFEi9Rwhl3ASWdMjXKNcMDF9Du0zlj0JZqtF5ly0CVdIMuQK
          0X90+Twp
          -----END PRIVATE KEY-----
          APPLE_KEY

      - name: Fetch signing files from Apple
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @file:~/.appstoreconnect/private_keys/AuthKey_W8RCTZ59R2.p8 \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply code signing profiles
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: W8RCTZ59R2
        issuer_id: "07922d40-426a-4a77-bc97-4d2959bfb708"
        submit_to_testflight: true
        cancel_previous_submissions: true
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
