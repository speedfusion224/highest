workflows:
  build-web:
    name: Build Web App
    max_build_duration: 120
    environment:
      node: 20.0.0
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
    artifact_paths:
      - dist/**/*
    cache:
      - ~/.npm
    publishing:
      scripts:
        - name: Upload artifacts
          script: |
            echo "Artifacts available in Codemagic build output."
